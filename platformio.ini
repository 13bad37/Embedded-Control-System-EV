[platformio]
default_envs = lptm4c1294ncpdt
extra_configs =
    platformio.local.ini

[project_paths]
; If anyone really needs an external install, override the ignored platformio.local.ini file instead of touching the committed config.
tivaware = vendor/tivaware
freertos = ${project_paths.tivaware}/third_party/FreeRTOS
freertos_port = ${project_paths.freertos}/portable/GCC/ARM_CM4F

[env:lptm4c1294ncpdt]
platform = titiva
board = lptm4c1294ncpdt
upload_protocol = ti-icdi
debug_tool = ti-icdi
monitor_speed = 115200
board_build.mcu = lptm4c1294ncpdt
board_build.f_cpu = 120000000L
board_build.ldscript = src/platformio_linker.ld
extra_scripts =
    pre:scripts/aest_build_time.py

build_flags =
    -mfpu=fpv4-sp-d16
    -mfloat-abi=softfp
    -D PART_TM4C1294NCPDT
    -D TARGET_IS_TM4C129_RA2
    -D gcc
    -Iinclude
    -Iinclude/rtos
    -Ilib/motorlib
    -I${project_paths.tivaware}
    -I${project_paths.freertos}/include
    -I${project_paths.freertos_port}
    -Wl,--entry=ResetISR
    -Llib/motorlib
    -lmotorlib
    -Wall
    -Wextra
    -Wno-unused-parameter

lib_ldf_mode = chain+
